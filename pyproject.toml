[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation built from scratch"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.7.1",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "xxhash",
    "flash-attn==2.8.3.post1",
]

[project.urls]
Homepage = "https://github.com/GeeeekExplorer/nano-vllm"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3.post1/flash_attn-2.8.3.post1%2Bcu12torch2.7cxx11abiTRUE-cp311-cp311-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
no-build-isolation-package = ["flash-attn"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.3.post1"
requires-dist = ["torch==2.7.1", "einops"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
